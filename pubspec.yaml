name: book_catalog
description: AI-powered book cataloging app with Google Gemini integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Local Database (kept for caching/offline support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.3

  # State Management
  provider: ^6.1.1

  # Google Gemini AI
  google_generative_ai: ^0.2.2

  # HTTP & API calls
  http: ^1.1.2
  dio: ^5.4.0

  # Barcode Scanner
  mobile_scanner: ^3.5.5

  # Image Picker & Camera
  image_picker: ^1.0.7

  # UI Components
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_svg: ^2.0.9

  # Export functionality
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  permission_handler: ^11.2.0

  # Loading & UI helpers
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
